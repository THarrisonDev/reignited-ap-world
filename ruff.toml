# Minimal lint stance for the apworld: correctness over style.
# Targets the Python that ships inside the .apworld. Run via `make lint`
# (world/Makefile) or CI. ruff only — one tool, fast, no config sprawl.
target-version = "py313"
line-length = 90
extend-exclude = ["__pycache__"]

[lint]
select = [
    "E9",   # syntax errors / indentation
    "F",    # pyflakes: undefined names, unused imports, f-string issues
    "B",    # bugbear: common bug patterns
    "SIM",  # flake8-simplify: simplifiable code
]
ignore = [
    "SIM117", # nested with — used for AP's option/rule context managers
    # AP world modules intentionally keep the short names (Items, Options,
    # Game, Names) that the platform's loader expects; PEP8 module naming
    # does not apply to the subpackage layout mirrored from S2AP/S3AP.
    "N999",
    # The codebase targets AP's runtime (which still runs 3.10-style typing
    # imports fine); don't churn List/Optional -> list/| while the platform
    # minimum is 0.6.1.
    "UP006", "UP035", "UP045",
    # Dataclass/pydantic-style class attrs trip this; not worth churn.
    "RUF012",
    # level_key_name(level) as a default arg is a deliberate idiom here.
    "B008",
]

[lint.per-file-ignores]
# Locations.py files are long declarative tables; unused loop vars are idiomatic.
"spyro*/Locations.py" = ["B007"]
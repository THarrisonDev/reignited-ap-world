name: world

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: compile & lint & consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff, config in ruff.toml)
        run: python -m ruff check .
      - name: Byte-compile all Python sources
        run: python -m compileall -q .
      - name: Version lockstep (archipelago.json <-> __init__.py)
        run: make check-version
      - name: Validate archipelago.json
        run: python -c "import json; json.load(open('archipelago.json')); print('archipelago.json OK')"

  options-doc:
    name: options docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.7
          path: ap-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AP requirements needed by the options layer
        run: pip install schema pathspec PyYAML typing_extensions
      - name: docs/options.md matches Options.py
        run: make options-doc-check
        env:
          ARCHIPELAGO_ROOT: ${{ github.workspace }}/ap-source

  generation:
    name: generation smoke test (Archipelago 0.6.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout world
        uses: actions/checkout@v4
        with:
          path: world-src
      - name: Checkout Archipelago (pinned to the version players run)
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.7
          path: ap-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Just the subset real generation needs: the GUI extras in AP's
      # requirements.txt (kivy etc.) are never imported by a headless generate.
      - name: Install AP generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bsdiff4 schema pathspec PyYAML orjson jellyfish jinja2 \
            colorama platformdirs typing_extensions websockets pytest
      - name: Place the world at worlds/reignited
        run: ln -s "$GITHUB_WORKSPACE/world-src" ap-source/worlds/reignited
      - name: Generate each game alone and all three together, then assert slot data
        working-directory: ap-source
        run: python -m pytest worlds/reignited/test -q

  apworld:
    name: apworld packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # make package = compileall + ruff lint + zip via scripts/package_apworld.py
      # (respects .apignore, hard-excludes dev-only files) + self-verification
      # (integrity, no .pyc, sources present).
      - name: Install ruff
        run: pip install ruff
      - name: Package .apworld
        run: make package
